name: Aikya | Catalog and skills contracts

on:
  push:
    branches: [develop, main, 'feat/**', 'fix/**', 'release/**', 'refactor/**']
    paths:
      - 'src/aikya/catalogs/**'
      - 'src/aikya/installation/**'
      - 'src/aikya/cli/**'
      - 'aikya_setup.py'
      - 'engineering_catalog.py'
      - 'src/aikya/resources/**'
      - 'scripts/ci/check_assets.py'
      - '.github/workflows/check-asset-sync.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/aikya/catalogs/**'
      - 'src/aikya/installation/**'
      - 'src/aikya/cli/**'
      - 'aikya_setup.py'
      - 'engineering_catalog.py'
      - 'src/aikya/resources/**'
      - 'scripts/ci/check_assets.py'
      - '.github/workflows/check-asset-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aikya-catalog-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Engineering catalog and Aikya commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contributor package and build tools
        run: |
          python -m pip install 'setuptools>=77' wheel build
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Check source tree contracts and specialist frontmatter
        run: python scripts/ci/check_assets.py
