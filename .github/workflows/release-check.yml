name: Aikya | Release version contract

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feat/**', 'fix/**', 'release/**', 'refactor/**']
    paths:
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'scripts/ci/release_contract.py'
      - 'scripts/ci/github_tag.py'
      - 'tests/test_github_tag.py'
      - 'tests/test_release_workflows.py'
      - '.github/workflows/release-check.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aikya-release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate VERSION and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contributor package and build tools
        run: |
          python -m pip install 'setuptools>=77' wheel build
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Validate version and release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python scripts/ci/release_contract.py check --base-ref origin/main
          else
            python scripts/ci/release_contract.py check
          fi
      - name: Test release contract
        run: python -m unittest discover -s tests -p 'test_release_workflows.py' -v
