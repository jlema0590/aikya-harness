name: Aikya | Automatic GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aikya-release-publication
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify release contract, tests and catalog
    if: github.repository == 'jlema0590/aikya-harness' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.contract.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contributor package and build tools
        run: |
          python -m pip install 'setuptools>=77' wheel build
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Validate VERSION, changelog and tags
        id: contract
        run: python scripts/ci/release_contract.py check --github-output "$GITHUB_OUTPUT"
      - name: Check Python syntax
        run: |
          python -m compileall -q src scripts/ci
          python -m py_compile scripts/ci/github_tag.py

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Check curated catalog and example profiles
        run: |
          python scripts/ci/check_assets.py
          python scripts/ci/smoke_profiles.py

  package:
    name: Build source archive and checksum
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contributor package and build tools
        run: |
          python -m pip install 'setuptools>=77' wheel build
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Create source ZIP and notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python scripts/ci/release_contract.py notes --output dist/RELEASE_NOTES.md
          git archive --format=zip --prefix=aikya-harness/ \
            --output="dist/aikya-harness-$RELEASE_TAG.zip" "$GITHUB_SHA"
          (cd dist && sha256sum "aikya-harness-$RELEASE_TAG.zip" > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: aikya-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Create tag and publish GitHub Release
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contributor package and build tools
        run: |
          python -m pip install 'setuptools>=77' wheel build
          python -m pip install --no-build-isolation --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: aikya-release-${{ github.sha }}
          path: dist
      - name: Validate archive
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/aikya-harness-$RELEASE_TAG.zip"
          test -s dist/SHA256SUMS
          test -s dist/RELEASE_NOTES.md
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Check tag existence with explicit HTTP handling
        id: tag_state
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python3 scripts/ci/github_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$GITHUB_SHA")"
          case "$STATUS" in
            match|missing)
              echo "Tag $RELEASE_TAG: $STATUS"
              echo "tag_status=$STATUS" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::Unexpected tag status: $STATUS"; exit 1 ;;
          esac

      - name: Publish GitHub Release or recover missing assets
        shell: bash
        env:
          TAG_STATUS: ${{ steps.tag_state.outputs.tag_status }}
        run: |
          set -euo pipefail
          ZIP="aikya-harness-$RELEASE_TAG.zip"

          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "Existing release detected; attaching only missing artifacts."
            for ASSET in "$ZIP" SHA256SUMS; do
              if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
                | grep -Fxq "$ASSET"; then
                gh release upload "$RELEASE_TAG" "dist/$ASSET"
              fi
            done
          elif [[ "$TAG_STATUS" == "match" ]]; then
            # Recovery when a previous job created the tag but failed to publish.
            gh release create "$RELEASE_TAG" "dist/$ZIP" dist/SHA256SUMS \
              --verify-tag --title "Aikya Harness $RELEASE_TAG" \
              --notes-file dist/RELEASE_NOTES.md --latest
          elif [[ "$TAG_STATUS" == "missing" ]]; then
            # gh creates a lightweight tag at the exact validated SHA.
            # Avoid a separate tag-create API call that can leave orphaned tags.
            gh release create "$RELEASE_TAG" "dist/$ZIP" dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "Aikya Harness $RELEASE_TAG" \
              --notes-file dist/RELEASE_NOTES.md --latest
          else
            echo "::error::Unexpected tag state"; exit 1
          fi

          # Verify that the remote tag still resolves to the expected commit.
          python3 scripts/ci/github_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" | grep -Fxq match
          gh release view "$RELEASE_TAG" --json url --jq '.url'
